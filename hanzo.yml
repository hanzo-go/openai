# The race detector and `go vet` come from the sanity check this replaces; the
# integration suite it sat beside drives the live OpenAI API and has no key
# declared here, so it belongs to a harness, not a push gate.
test:
  - name: build
    run: |
      set -euo pipefail
      go build ./...
      go vet ./...
      go test -race ./...
